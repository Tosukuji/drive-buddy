<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1622">
<meta name="description" content="キャラクターが運転の前後に付き添い、運転中は声で案内してくれるドライブ相棒アプリ(試作版)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ミチのドライブ相棒</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Layout: one-screen phone app. The character stands on a time-of-day sky (the "stage");
   below it sits an instrument-cluster panel whose readouts use a dark LCD in both themes.
   Rest-stop cards borrow the colours of Japanese road guide signs (green = expressway, blue = general road). */
:root {
  --bg: #e7ecf1;
  --panel: #f7f9fb;
  --ink: #132031;
  --muted: #586a7e;
  --line: #cbd5df;
  --accent: #b35c00;
  --accent-ink: #fffaf3;
  --accent-soft: #f6e3cc;
  --lcd-bg: #0e1622;
  --lcd-fg: #ffc266;
  --lcd-dim: #75869b;
  --lcd-line: #223047;
  --bubble: rgba(247, 249, 251, 0.95);
  --warn: #c2410c;
  --ok: #2e7d4f;
  --sign-green: #16784a;
  --sign-blue: #1d5aa6;
  --sign-ink: #ffffff;
  --shadow: 0 6px 24px rgba(16, 30, 48, 0.14);

  --font-ui: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
  --font-voice: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
  --font-meter: "B612 Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.5rem;
  --fs-meter: 2.75rem;
  --radius: 14px;
}
:root[lang="zh"] {
  --font-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-voice: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
:root[lang="ko"] {
  --font-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-voice: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a111c; --panel: #111a28; --ink: #e4ebf3; --muted: #8b9bb0; --line: #233149;
    --accent: #ffb547; --accent-ink: #1c1306; --accent-soft: #3a2a12;
    --lcd-bg: #060b12; --lcd-fg: #ffc266; --lcd-dim: #64748a; --lcd-line: #1b2738;
    --bubble: rgba(17, 26, 40, 0.94); --warn: #ff8a5c; --ok: #6fd39a;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a111c; --panel: #111a28; --ink: #e4ebf3; --muted: #8b9bb0; --line: #233149;
  --accent: #ffb547; --accent-ink: #1c1306; --accent-soft: #3a2a12;
  --lcd-bg: #060b12; --lcd-fg: #ffc266; --lcd-dim: #64748a; --lcd-line: #1b2738;
  --bubble: rgba(17, 26, 40, 0.94); --warn: #ff8a5c; --ok: #6fd39a;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app {
  position: relative;
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

/* ---------- top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  z-index: 3;
}
.brand {
  display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1;
  background: none; border: 0; padding: 4px 2px; text-align: left; white-space: nowrap; overflow: hidden;
}
.brand b { flex: none; font-family: var(--font-voice); font-weight: 700; font-size: var(--fs-xl); letter-spacing: 0.04em; line-height: 1; }
.brand .caret { flex: none; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
.brand span { color: var(--muted); font-size: var(--fs-xs); letter-spacing: 0.06em; overflow: hidden; text-overflow: ellipsis; }
.aff-chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 3px 10px; border-radius: 999px;
  background: var(--accent-soft); color: var(--ink);
  font-size: var(--fs-xs); white-space: nowrap;
}
.aff-chip b { font-family: var(--font-meter); color: var(--accent); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; flex: none;
  min-width: 44px; height: 40px; padding: 0 8px;
  border: 1px solid var(--line); border-radius: 10px; background: transparent;
  font-size: var(--fs-xs);
}
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- stage ---------- */
#stage { position: relative; flex: 1 1 auto; min-height: 220px; overflow: hidden; }
.sky { position: absolute; inset: 0; transition: background 1.2s ease; }
#stage[data-tod="dawn"]  .sky { background: linear-gradient(180deg, #86aed4 0%, #c9c6d6 45%, #f4c9a6 82%, #f7dcc2 100%); }
#stage[data-tod="day"]   .sky { background: linear-gradient(180deg, #5f9fd8 0%, #9cc6ea 50%, #d8e8f4 100%); }
#stage[data-tod="dusk"]  .sky { background: linear-gradient(180deg, #2f3b66 0%, #8c4f78 48%, #e48c5a 85%, #f2b177 100%); }
#stage[data-tod="night"] .sky { background: linear-gradient(180deg, #0a1430 0%, #172650 62%, #2a3b63 100%); }
#stage[data-tod="late"]  .sky { background: linear-gradient(180deg, #04070e 0%, #0b1325 70%, #141e35 100%); }
.sky::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26%;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0) 6px),
    linear-gradient(180deg, rgba(20,28,40,0.0), rgba(20,28,40,0.28));
}
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
body[data-mode="drive"] #c, body[data-mode="drive"] .sky { filter: brightness(0.55) saturate(0.8); transition: filter 0.6s; }

.loading {
  position: absolute; inset: 0; display: grid; place-items: center;
  color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.5); font-size: var(--fs-sm);
  pointer-events: none;
}
.loading .meter { width: 160px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.loading .meter i { display: block; height: 100%; width: 0; background: #fff; transition: width 0.2s; }
.fallback-face {
  position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
  width: 132px; height: 132px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--panel); color: var(--accent); border: 3px solid var(--accent);
  font-family: var(--font-voice); font-size: 3.5rem; font-weight: 700;
  box-shadow: var(--shadow);
}

.bubble {
  position: absolute;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: 14px;
  max-width: 460px; margin: 0 auto;
  padding: 10px 14px 12px;
  background: var(--bubble);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  font-family: var(--font-voice);
  font-weight: 500;
  font-size: var(--fs-md);
  line-height: 1.65;
  min-height: 4.6em;
}
.bubble::before {
  content: ""; position: absolute; top: -9px; left: 50%; margin-left: -9px;
  width: 16px; height: 16px; background: var(--bubble);
  border-left: 1px solid var(--line); border-top: 1px solid var(--line);
  transform: rotate(45deg);
}
.bubble .who { display: block; font-size: var(--fs-xs); font-weight: 700; color: var(--accent); letter-spacing: 0.1em; }
.bubble p { margin: 0; min-height: 3.3em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- panel ---------- */
#panel {
  flex: 0 0 auto;
  max-height: 62%;
  overflow-y: auto;
  background: var(--panel);
  border-top: 1px solid var(--line);
  padding-block: 14px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  z-index: 2;
}
.pane { display: flex; flex-direction: column; gap: 12px; }
.pane-title { margin: 0; font-size: var(--fs-lg); font-weight: 700; text-wrap: balance; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.row.split { justify-content: space-between; }
.row.split > * { flex: 0 0 auto; }

.btn {
  position: relative; overflow: hidden;
  min-height: 48px; padding: 10px 16px;
  border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink);
  font-weight: 700; font-size: var(--fs-md);
  user-select: none; -webkit-user-select: none;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; min-height: 54px; font-size: var(--fs-lg); }
.btn.small { min-height: 40px; padding: 6px 14px; font-size: var(--fs-sm); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:not(:disabled):active { transform: translateY(1px); }
.btn .fill { position: absolute; inset: 0; background: rgba(255,255,255,0.28); transform: scaleX(0); transform-origin: left; pointer-events: none; }
.btn .lbl { position: relative; }
.link { background: none; border: 0; padding: 6px 2px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: var(--fs-sm); }
.link.danger { color: var(--warn); }

/* LCD readouts */
.lcd {
  background: var(--lcd-bg); color: var(--lcd-fg);
  border-radius: 12px; padding: 12px 14px;
  font-family: var(--font-meter);
  font-variant-numeric: tabular-nums;
  box-shadow: inset 0 0 0 1px var(--lcd-line), inset 0 8px 18px rgba(0,0,0,0.35);
}
.lcd .lab { display: block; font-size: 0.6875rem; color: var(--lcd-dim); letter-spacing: 0.14em; font-family: var(--font-meter); line-height: 1.3; }
.lcd .lab.jp { font-family: var(--font-ui); letter-spacing: 0.06em; }
.lcd b { font-weight: 700; font-size: var(--fs-xl); line-height: 1.15; }
.lcd .unit { font-size: var(--fs-xs); color: var(--lcd-dim); margin-left: 3px; }
.lcd-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lcd-grid > div { min-width: 0; }
.lcd-grid > div + div { border-left: 1px solid var(--lcd-line); padding-left: 10px; }

.aff { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 10px; font-size: var(--fs-sm); }
.aff .name { font-weight: 700; }
.aff .next { color: var(--muted); font-size: var(--fs-xs); }
.bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width 0.8s ease; }
.last { margin: 0; color: var(--muted); font-size: var(--fs-sm); }

/* checks */
.checks { display: flex; flex-direction: column; gap: 8px; }
.check {
  display: flex; align-items: center; gap: 12px; text-align: left;
  min-height: 52px; padding: 8px 14px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
  font-size: var(--fs-md);
}
.check .box { flex: none; width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; }
.check[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.check[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.check[aria-pressed="true"] .box::after { content: ""; width: 7px; height: 13px; border: solid var(--accent-ink); border-width: 0 3px 3px 0; transform: translateY(-2px) rotate(45deg); }

/* drive */
.trip-head { display: flex; align-items: center; gap: 8px; }
.trip-head .lab { flex: 1; }
.chip { font-size: 0.6875rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--lcd-fg); color: var(--lcd-fg); letter-spacing: 0.1em; }
.wake { font-size: 0.6875rem; color: var(--lcd-dim); font-family: var(--font-ui); }
.big { font-size: var(--fs-meter); font-weight: 700; letter-spacing: 0.02em; line-height: 1.1; margin: 4px 0 10px; }
.trip-sub { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; border-top: 1px solid var(--lcd-line); padding-top: 8px; }
.trip-sub b { font-size: var(--fs-lg); }
.trip-sub .due { color: #ff8a5c; }
.hint { margin: 0; color: var(--muted); font-size: var(--fs-sm); }

/* rest-stop card */
.stop-card { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 2px solid var(--sign-green); border-radius: 12px; background: var(--bg); }
.stop-card[data-kind="michi"] { border-color: var(--sign-blue); }
.stop-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.stop-kind { flex: none; padding: 1px 7px; border-radius: 4px; background: var(--sign-green); color: var(--sign-ink); font-family: var(--font-meter); font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.06em; }
.stop-card[data-kind="michi"] .stop-kind { background: var(--sign-blue); }
.stop-top b { font-size: var(--fs-lg); min-width: 0; }
.stop-dist { margin-left: auto; font-family: var(--font-meter); font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: var(--fs-xs); padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); }
.tag.c0 { border-color: var(--ok); color: var(--ok); }
.tag.c1 { border-color: var(--accent); color: var(--accent); }
.tag.c2 { border-color: var(--warn); color: var(--warn); }
.listen { display: flex; align-items: center; gap: 8px; margin: 0; font-size: var(--fs-xs); color: var(--muted); }
.listen.on::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
.stop-state { margin: 0; font-weight: 700; font-size: var(--fs-sm); color: var(--ok); }

/* arrive */
.sum { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.sum b { font-size: var(--fs-lg); }
.field { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); }
.field > span:first-child { color: var(--muted); }
.field .inline { display: flex; align-items: center; gap: 8px; }
.field input[type="text"], .field input[type="number"], .field select {
  min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); font-size: var(--fs-md); width: 100%; min-width: 0;
}
.field input[type="range"] { width: 100%; accent-color: var(--accent); }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: var(--fs-md); }
.toggle input { flex: none; width: 22px; height: 22px; accent-color: var(--accent); }
.toggle span { min-width: 0; }
.note { margin: 0; color: var(--muted); font-size: var(--fs-xs); }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg label { position: relative; display: grid; place-items: center; min-height: 44px; padding: 6px; text-align: center; font-size: var(--fs-sm); cursor: pointer; background: var(--bg); }
.seg label + label { border-left: 1px solid var(--line); }
.seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.seg label:has(input:checked) { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.seg label:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: -3px; }

/* ---------- sheets ---------- */
.sheet {
  position: absolute; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  background: var(--bg);
  animation: rise 0.22s ease-out;
}
@keyframes rise { from { transform: translateY(16px); } to { transform: none; } }
.sheet-head {
  display: flex; align-items: center; gap: 10px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.sheet-head h2 { flex: 1; margin: 0; font-size: var(--fs-lg); }
.sheet-body {
  flex: 1; overflow-y: auto;
  padding-block: 16px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.group { display: flex; flex-direction: column; gap: 12px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.group h3 { margin: 0; font-size: var(--fs-sm); color: var(--muted); letter-spacing: 0.06em; }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.hist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.hist .d { font-weight: 700; }
.hist .m { color: var(--muted); font-size: var(--fs-xs); }
.hist .t { font-family: var(--font-meter); font-variant-numeric: tabular-nums; text-align: right; font-weight: 700; }
.hist .k { font-family: var(--font-meter); font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); font-size: var(--fs-xs); }
.credits { font-size: var(--fs-xs); color: var(--muted); line-height: 1.7; }
.hist .pl { grid-column: 1 / -1; font-size: var(--fs-xs); color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.places { margin: 0; font-size: var(--fs-sm); color: var(--muted); overflow-wrap: anywhere; }
.places a, .hist .pl a { color: var(--ink); text-underline-offset: 3px; }

/* persona cards */
.cards { display: flex; flex-direction: column; gap: 10px; }
.pcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.pcard.on { border-color: var(--accent); background: var(--accent-soft); }
.pcard .pn { font-family: var(--font-voice); font-weight: 700; font-size: var(--fs-lg); line-height: 1.3; }
.pcard .pt { color: var(--muted); font-size: var(--fs-xs); }
.pcard .ps { grid-column: 1 / -1; margin: 6px 0 0; font-family: var(--font-voice); font-size: var(--fs-sm); }
.pcard .pb { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
.pcard .badge { font-size: var(--fs-xs); font-weight: 700; color: var(--accent); }

@media (max-width: 420px) { .brand span { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .sheet { animation: none; }
  .sky, .bar i { transition: none; }
  .listen.on::before { animation: none; }
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="brand" id="open-persona" aria-haspopup="dialog">
      <b id="char-name">ミチ</b>
      <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      <span data-i18n="brandSub">ドライブ相棒</span>
    </button>
    <span class="aff-chip"><b>Lv<span id="chip-lv">1</span></b><span id="chip-name">はじめまして</span></span>
    <button class="icon-btn" id="open-history" data-i18n-aria="historyAria" aria-label="ドライブ記録">

async function fetchBundledModel(onProgress) {
  const res = await fetch(MODEL_URL);
  if (!res.ok) throw new Error(`model fetch failed (${res.status})`);
  const total = Number(res.headers.get('content-length')) || MODEL_BYTES;
  let bytes;
  if (res.body && res.body.getReader) {
    const reader = res.body.getReader(); const parts = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value); got += value.length;
      onProgress && onProgress(Math.min(1, got / total));

    bytes = new Uint8Array(got); let o = 0;
    for (const p of parts) { bytes.set(p, o); o += p.length; }
  } else bytes = new Uint8Array(await res.arrayBuffer());
  if (!MODEL_URL.endsWith('.b64.txt')) return bytes.buffer;
  const bin = atob(new TextDecoder().decode(bytes).trim());

  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);

}

/* ---------- drive ---------- */
let drive = null, driveTimer = 0, wake = null;
function startDrive({ demo, checked }) {
  const now = Date.now();
  drive = {
    demo, checked, startedAt: now, sim: 0, lastReal: now,
    breaks: 0, lastHour: 0, breakAt: Number(S().breakMin) || 120, dueSaid: false, nagAt: Infinity,
    km: 0, gps: demo ? 'demo' : 'pending', lastPos: null, watch: null, startFix: null, lastFix: null,
    lastSpoke: 0, nextChat: 25, stops: demo ? DEMO_STOPS.map((s) => ({ ...s, state: 'ahead' })) : [], stop: null,
  };
  hideStopCard();
  setMode('drive');
  $('#demo-chip').hidden = !demo;
  $('#wake-note').textContent = '';
  if (demo) say('demoStart');
  else if (tod(new Date(now)) === 'late') say('departLate');
  else if (!checked) say('departSkip');
  else say('depart');
  if (!demo) {
    startGPS();
    if (S().placesOn) { const d = drive; getFix(15000).then((f) => { if (f && !d.startFix) d.startFix = f; }); }
  }
  requestWake();
  clearInterval(driveTimer);
  driveTimer = setInterval(tick, demo ? 250 : 1000);
  tick();
}
// Demo time runs at 120×, but slows down while a rest stop is being asked about or approached.
function curSpeed() {
  if (!drive || !drive.demo) return 1;
  const st = drive.stop;
  if (st && st.state === 'asking') return 2;
  if (st && st.state === 'going') return 30;
  return 120;
}
function elapsedSec() {
  if (!drive) return 0;
  const now = Date.now();
  drive.sim += ((now - drive.lastReal) / 1000) * curSpeed();
  drive.lastReal = now;
  return drive.sim;
}
function tick() {
  if (!drive) return;
  const s = elapsedSec(), m = s / 60;
  $('#trip-time').textContent = hms(s);
  if (drive.demo) $('#demo-chip').textContent = `DEMO ×${curSpeed()}`;
  const br = $('#trip-break');
  const stopBusy = drive.stop && (drive.stop.state === 'asking' || drive.stop.state === 'going');
  if (m >= drive.breakAt) {
    br.textContent = T('breakNow');
    br.classList.add('due');
    if (!stopBusy) {
      if (!drive.dueSaid) { drive.dueSaid = true; drive.nagAt = m + 30; say('breakDue', { t: fmtDur(m) }); }
      else if (m >= drive.nagAt) { drive.nagAt = m + 30; say('breakNag'); }
    }
  } else {
    br.textContent = T('breakIn', { t: hm(drive.breakAt - m) });
    br.classList.remove('due');
    const h = Math.floor(m / 60);
    if (h >= 1 && h > drive.lastHour) {
      drive.lastHour = h;
      if (drive.breakAt - m > 5 && !stopBusy && S().verbosity !== 'guide') say('hourly', { h });
    }
  }
  if (drive.demo) drive.km = (m / 60) * DEMO_KMH;
  const kmEl = $('#trip-km');
  if (drive.gps === 'on' || drive.gps === 'demo') kmEl.textContent = `${fmtKm(drive.km)} km`;
  else if (drive.gps === 'pending') kmEl.textContent = T('gpsPending');
  else kmEl.textContent = T('gpsOff');

  if (!drive) return;
  updateStops(m);
  // small talk in chatty mode, only when nothing else was said recently
  if (S().verbosity === 'chatty' && m >= drive.nextChat && !drive.stop && m - drive.lastSpoke > 8 && m < drive.breakAt - 5) {
    drive.nextChat = m + 25;
    say('chat');
  }
}
$('#break-btn').addEventListener('click', () => {
  if (!drive) return;
  takeBreak();
  say('breakTaken');
  tick();
});
function takeBreak() {
  const m = elapsedSec() / 60;
  drive.breaks += 1;
  drive.breakAt = m + (Number(S().breakMin) || 120);
  drive.dueSaid = false; drive.nagAt = Infinity;
  drive.lastHour = Math.floor(m / 60);
}

/* ---------- rest stops (demo data) ---------- */
let listenTimer = 0, recog = null, micBlocked = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
function stopTags(st) {
  const box = $('#stop-tags'); box.textContent = '';
  const a = document.createElement('span'); a.className = 'tag'; a.textContent = fmtHours(st.hours);
  const b = document.createElement('span'); b.className = `tag c${st.crowd}`; b.textContent = T('crowd')[st.crowd];
  box.append(a, b);
}
function renderStopCard() {
  const st = drive && drive.stop; if (!st) return;
  const card = $('#stop-card');
  card.dataset.kind = st.kind;
  $('#stop-kind').textContent = st.kind === 'michi' ? ({ ja: '道の駅', zh: '休息站', ko: '미치노에키', en: 'ROADSIDE' })[lang()] : st.kind;
  $('#stop-name').textContent = st.short[lang()] || st.short.ja;
  stopTags(st);
  const m = elapsedSec() / 60;
  const left = Math.max(0, (st.reachAt - m) * (DEMO_KMH / 60));
  $('#stop-dist').textContent = T('stopAway', { d: T('distShow', { n: left.toFixed(1) }) });
  const asking = st.state === 'asking';
  $('#stop-actions').hidden = !asking;
  $('#stop-state').hidden = asking;
  if (!asking) $('#stop-state').textContent = st.state === 'going' ? `✓ ${T('yes')}` : T('no');
  card.hidden = false;
  $('#drive-hint').hidden = true;
}
function hideStopCard() {
  $('#stop-card').hidden = true; $('#drive-hint').hidden = false;
  stopListening();
}
function updateStops(m) {
  if (!drive.stops.length) return;
  const st = drive.stop;
  if (st) {
    if (st.state === 'going' && m >= st.reachAt) {
      drive.stop = null; hideStopCard();
      takeBreak();
      say('stopReached', { stop: st.name[lang()] || st.name.ja });
      return;
    }
    if (st.state === 'passed' && m >= st.reachAt) { drive.stop = null; hideStopCard(); return; }
    renderStopCard();
    return;
  }
  if (!S().stopsOn) return;
  const next = drive.stops.find((s) => s.state === 'ahead' && m >= s.at);
  if (next) announceStop(next, m);
}
async function announceStop(st, m) {
  st.state = 'asking';
  st.reachAt = st.at + st.km / (DEMO_KMH / 60);
  drive.stop = st;
  renderStopCard();
  const info = S().stopsInfo ? T('info', { hours: fmtHours(st.hours), crowd: T('crowd')[st.crowd] }) : '';
  const key = m >= drive.breakAt - 15 ? 'stopAheadBreak' : 'stopAhead';
  setListenNote('');
  const finished = await say(key, { stop: st.name[lang()] || st.name.ja, dist: T('distSpeak', { n: st.km }), info });
  if (!drive || drive.stop !== st || st.state !== 'asking') return;
  if (finished) startListening(st);
  clearTimeout(listenTimer);
  listenTimer = setTimeout(() => { if (drive && drive.stop === st && st.state === 'asking') answerStop(null); }, 12000);
}
function setListenNote(text, on = false) {
  const el = $('#stop-listen'); el.textContent = text; el.classList.toggle('on', on);
}
function startListening(st) {
  if (!S().voiceReply) { setListenNote(''); return; }
  if (!SR || micBlocked) { setListenNote(T('micUnavailable')); return; }
  try {
    recog = new SR();
    recog.lang = T('ttsLang');
    recog.interimResults = false;
    recog.maxAlternatives = 3;
    recog.onresult = (ev) => {
      const alts = [...ev.results[0]].map((a) => a.transcript.toLowerCase());
      const words = alts.join(' ');
      setListenNote(T('heard', { w: alts[0] }), true);
      if (T('noWords').some((w) => words.includes(w))) answerStop(false);
      else if (T('yesWords').some((w) => words.includes(w))) answerStop(true);
    };
    recog.onerror = (ev) => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed' || ev.error === 'audio-capture') {
        micBlocked = true; setListenNote(T('micUnavailable'));
      }
    };
    recog.onend = () => { if (drive && drive.stop === st && st.state === 'asking' && !micBlocked) setListenNote(T('micUnavailable')); };
    recog.start();
    setListenNote(T('listening'), true);
  } catch { micBlocked = true; setListenNote(T('micUnavailable')); }
}
function stopListening() { try { recog && recog.abort(); } catch {} recog = null; clearTimeout(listenTimer); }
function answerStop(yes) {
  const st = drive && drive.stop; if (!st || st.state !== 'asking') return;
  stopListening();
  const name = st.name[lang()] || st.name.ja;
  if (yes === true) { st.state = 'going'; say('stopYes', { stop: name }); }
  else { st.state = 'passed'; say(yes === false ? 'stopNo' : 'stopNoReply', { stop: name }); }
  setListenNote('');
  renderStopCard();
}
$('#stop-yes').addEventListener('click', () => answerStop(true));
$('#stop-no').addEventListener('click', () => answerStop(false));

/* ---------- GPS + wake lock ---------- */
function haversine(a, b) {
  const R = 6371000, toR = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toR, dLon = (b.lon - a.lon) * toR;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function startGPS() {
  if (!('geolocation' in navigator)) { drive.gps = 'off'; return; }
  try {
    drive.watch = navigator.geolocation.watchPosition((pos) => {
      if (!drive) return;
      drive.gps = 'on';
      const { latitude: lat, longitude: lon, accuracy } = pos.coords;
      drive.lastFix = { lat, lon, acc: accuracy, t: Date.now() };
      if (!drive.startFix && accuracy <= 200) drive.startFix = drive.lastFix;
      if (accuracy > 60) return;
      const here = { lat, lon };
      if (!drive.lastPos) { drive.lastPos = here; return; }
      const d = haversine(drive.lastPos, here);
      if (d > 10) { if (d < 5000) drive.km += d / 1000; drive.lastPos = here; }
    }, () => { if (drive) drive.gps = 'off'; }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
  } catch { drive.gps = 'off'; }
}
function stopGPS(d) { try { if (d && d.watch != null) navigator.geolocation.clearWatch(d.watch); } catch {} }
async function requestWake() {
  try {
    if (!('wakeLock' in navigator)) return;
    wake = await navigator.wakeLock.request('screen');
    $('#wake-note').textContent = T('wakeOn');
    wake.addEventListener('release', () => { $('#wake-note').textContent = ''; });
  } catch { $('#wake-note').textContent = ''; }
}
function releaseWake() { try { wake && wake.release(); } catch {} wake = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && drive && document.body.dataset.mode === 'drive' && (!wake || wake.released)) requestWake();
});

/* ---------- start / end places ---------- */
function getFix(timeout = 10000) {
  return new Promise((resolve) => {
    if (!('geolocation' in navigator)) { resolve(null); return; }
    try {
      navigator.geolocation.getCurrentPosition(
        (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() }),
        () => resolve(null), { enableHighAccuracy: true, timeout, maximumAge: 60000 });
    } catch { resolve(null); }
  });
}
const round3 = (x) => Math.round(x * 1000) / 1000; // about 100 m
const geoCache = new Map();
// Neighbourhood-level name from OpenStreetMap (Nominatim). Low volume only: two lookups per drive.
function placeName(lat, lon) {
  const key = `${round3(lat)},${round3(lon)},${lang()}`;
  if (!geoCache.has(key)) {
    geoCache.set(key, (async () => {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&lat=${round3(lat)}&lon=${round3(lon)}&accept-language=${lang()}`;
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        if (!res.ok) return null;
        const a = (await res.json()).address || {};
        const city = a.city || a.town || a.village || a.county || '';
        const area = a.city_district || a.suburb || a.quarter || a.neighbourhood || '';
        const parts = [city, area].filter(Boolean);
        if (!parts.length && (a.state || a.province)) parts.push(a.state || a.province);
        return parts.join(lang() === 'en' ? ', ' : ' ') || null;
      } catch { return null; }
    })());
  }
  return geoCache.get(key);
}
async function resolvePlaces(d) {
  let end = d.lastFix && Date.now() - d.lastFix.t < 120000 ? d.lastFix : null;
  if (!end) end = await getFix(8000);
  const start = d.startFix;
  const pack = async (f) => (f ? { name: await placeName(f.lat, f.lon), lat: round3(f.lat), lon: round3(f.lon) } : null);
  const [from, to] = await Promise.all([pack(start), pack(end)]);
  return { from, to };
}
function placeLine(el, from, to) {
  const part = (label, pl) => {
    const wrap = document.createElement('span');
    wrap.append(`${label}: `);
    if (!pl) { wrap.append('—'); return wrap; }
    const a = document.createElement('a');
    a.href = `https://www.google.com/maps/search/?api=1&query=${pl.lat},${pl.lon}`;
    a.target = '_blank'; a.rel = 'noopener';
    a.textContent = pl.name || T('placeUnknown');
    wrap.append(a);
    return wrap;
  };
  el.append(part(T('from'), from), ' → ', part(T('to'), to));
}

/* ---------- arrive (long press prevents accidental taps) ---------- */
(function holdToArrive() {
  const btn = $('#arrive-btn'), fillEl = $('#arrive-fill');
  const MS = 800; let start = 0, raf = 0, holding = false;
  const reset = () => { holding = false; cancelAnimationFrame(raf); fillEl.style.transform = 'scaleX(0)'; };
  const step = () => {
    const p = Math.min(1, (performance.now() - start) / MS);
    fillEl.style.transform = `scaleX(${p})`;
    if (p >= 1) { reset(); arrive(); } else raf = requestAnimationFrame(step);
  };
  btn.addEventListener('pointerdown', (e) => { if (e.button > 0) return; holding = true; start = performance.now(); raf = requestAnimationFrame(step); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, () => { if (holding) reset(); }));
  btn.addEventListener('click', (e) => { if (e.detail === 0) arrive(); });
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
})();

let pending = null;
function arrive() {
  if (!drive) return;
  clearInterval(driveTimer);
  stopGPS(drive);
  releaseWake();
  const min = elapsedSec() / 60;
  const d = drive; drive = null;
  hideStopCard();
  const km = d.gps === 'on' || d.demo ? d.km : null;
  const long = min >= 90;
  const pts = d.demo ? 0 : 10 + Math.min(12, Math.floor(min / 10)) + (d.checked ? 5 : 0) + (long && d.breaks > 0 ? 5 : 0);
  pending = { start: new Date(d.startedAt).toISOString(), min: Math.max(1, Math.round(min)), rawMin: min, km, breaks: d.breaks, checked: d.checked, demo: d.demo, pts };
  if (!d.demo && S().placesOn && (d.startFix || d.lastFix || d.gps !== 'off')) {
    const p = pending;
    p.placesLooking = true;
    p.placesDone = resolvePlaces(d).then((pl) => {
      p.from = pl.from; p.to = pl.to; p.placesLooking = false;
      if (pending === p) renderArrive();
      return pl;
    });
  }
  setMode('arrive');
  renderArrive();
  $('#km-input').value = '';
  const cat = min < 15 ? 'arriveShort' : min < 60 ? 'arriveMid' : min < 120 ? 'arriveLong' : 'arriveVlong';
  let extra = null;
  if (!d.demo && tod() === 'late') extra = 'arriveLate';
  else if (long && d.breaks > 0) extra = 'arriveGoodBreak';
  else if (min >= Number(S().breakMin || 120) + 30 && d.breaks === 0) extra = 'arriveNoBreak';
  say(cat, {}, { extra });
}
function renderArrive() {
  const p = pending; if (!p) return;
  $('#arrive-title').textContent = p.demo ? T('demoOver') : T('arriveTitle');
  $('#sum-time').textContent = fmtDur(p.rawMin);
  $('#sum-km').textContent = p.km != null ? `${fmtKm(p.km)} km` : '—';
  $('#sum-breaks').textContent = T('times', { n: p.breaks });
  $('#sum-pts').textContent = p.demo ? T('demoTag') : `+${p.pts}`;
  const pe = $('#sum-places');
  if (p.placesLooking) { pe.hidden = false; pe.textContent = T('placeLooking'); }
  else if (p.from || p.to) { pe.hidden = false; pe.textContent = ''; placeLine(pe, p.from, p.to); }
  else pe.hidden = true;
  $('#km-field').hidden = p.demo || p.km != null;
  $('#save-drive').textContent = p.demo ? T('backHome') : T('save');
  $('#discard-drive').hidden = p.demo;
}
$('#save-drive').addEventListener('click', () => {
  if (!pending) { setMode('home'); return; }
  const p = pending; pending = null;
  if (p.demo) { setMode('home'); renderHome(); say('demoEnd'); return; }
  const kmIn = parseFloat($('#km-input').value);
  const rec = {
    id: Math.random().toString(36).slice(2, 10), start: p.start, min: p.min,
    km: p.km != null ? Math.round(p.km * 10) / 10 : (Number.isFinite(kmIn) && kmIn > 0 ? Math.round(kmIn * 10) / 10 : null),
    breaks: p.breaks, checked: p.checked,
  };
  if (p.from) rec.from = p.from;
  if (p.to) rec.to = p.to;
  if (p.placesLooking && p.placesDone) {
    p.placesDone.then((pl) => {
      const r = Store.state.drives.find((x) => x.id === rec.id); if (!r) return;
      if (pl.from) r.from = pl.from; if (pl.to) r.to = pl.to;
      Store.save(); renderHome(); if (!$('#sheet-history').hidden) renderHistory();
    });
  }
  const beforeLv = levelOf(Store.state.points);
  Store.state.drives = [rec, ...Store.state.drives].slice(0, 500);
  Store.state.points += p.pts;
  Store.save();
  setMode('home');
  renderHome();
  const n = Store.state.drives.length, afterLv = levelOf(Store.state.points);
  if (afterLv > beforeLv) say('levelUp', { lv: T('levels')[afterLv] });
  else if ([5, 10, 20, 30, 50, 100, 200].includes(n)) say('milestone', { n });
  else say('saved');
});
$('#discard-drive').addEventListener('click', () => { pending = null; setMode('home'); say('discarded'); });

  $('#clear-confirm').hidden = true; $('#clear-start').hidden = false;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
$('#open-history').addEventListener('click', () => openSheet('#sheet-history'));
$('#open-settings').addEventListener('click', () => openSheet('#sheet-settings'));
$('#open-persona').addEventListener('click', () => openSheet('#sheet-persona'));

/* ---------- settings ---------- */
function renderSettings() {
  const p = persona();
  $('#set-lang').value = lang();
  $('#call-label').textContent = T('callLabel', { char: nameOf(p) });
  $('#set-name').value = S().callName || '';
  $('#set-name').placeholder = T('callPh', { call: defaultCall(p) });
  $('#set-voice').checked = !!S().voice;
  $('#set-pitch').value = S().pitchAdj || 0;
  $('#set-break').value = String(S().breakMin);
  $$('input[name="verb"]').forEach((r) => { r.checked = r.value === S().verbosity; });
  $('#set-stops').checked = !!S().stopsOn;
  $('#set-stops-info').checked = !!S().stopsInfo;
  $('#set-voice-reply').checked = !!S().voiceReply;
  $('#set-places').checked = !!S().placesOn;
  $('#mic-note').textContent = !SR || micBlocked ? T('micUnavailable') : '';
  $('#voice-note').textContent = !Voice.ok ? T('voiceNoTTS') : (Voice.voice ? T('voiceUsing', { v: Voice.voice.name }) : T('voiceNoLang'));
}
$('#set-lang').addEventListener('change', (e) => {
  S().lang = e.target.value; saveSoon();
  Voice.pick();
  applyI18n();
  say('hello');
});
$('#set-name').addEventListener('input', (e) => { S().callName = e.target.value.trim(); saveSoon(); });
$('#set-voice').addEventListener('change', (e) => { S().voice = e.target.checked; if (!S().voice && Voice.ok) speechSynthesis.cancel(); saveSoon(); });
$('#set-pitch').addEventListener('input', (e) => { S().pitchAdj = Number(e.target.value); saveSoon(); });
$('#set-break').addEventListener('change', (e) => { S().breakMin = Number(e.target.value); saveSoon(); });
$$('input[name="verb"]').forEach((r) => r.addEventListener('change', (e) => { if (e.target.checked) { S().verbosity = e.target.value; saveSoon(); } }));
$('#set-stops').addEventListener('change', (e) => { S().stopsOn = e.target.checked; saveSoon(); });
$('#set-stops-info').addEventListener('change', (e) => { S().stopsInfo = e.target.checked; saveSoon(); });
$('#set-voice-reply').addEventListener('change', (e) => { S().voiceReply = e.target.checked; saveSoon(); });
$('#set-places').addEventListener('change', (e) => { S().placesOn = e.target.checked; saveSoon(); });
$('#voice-test').addEventListener('click', () => { activated = true; Voice.pick(); say('voiceTest'); renderSettings(); });

$('#vrm-file').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f || !renderer) return;
  const note = $('#vrm-note');
  note.textContent = T('vrmLoading');
  const url = URL.createObjectURL(f);
  try {
    const vrm = await loadModel(url);
    const nm = vrm.meta && (vrm.meta.name || vrm.meta.title);
    note.textContent = T('vrmLoaded', { n: nm ? `: ${nm}` : '' });
    closeSheets();
    say('newModel');
  } catch {
    note.textContent = T('vrmFail');
  } finally { URL.revokeObjectURL(url); }
});
$('#vrm-reset').addEventListener('click', async () => {
  if (!renderer) return;
  $('#vrm-note').textContent = T('vrmLoading');
  try { await loadModel(await fetchBundledModel()); $('#vrm-note').textContent = T('vrmBack'); closeSheets(); say('tap'); }
  catch { $('#vrm-note').textContent = T('vrmFail'); }
});

/* ---------- persona sheet ---------- */
function setPersona(id) {
  S().persona = id; saveSoon();
  renderIdentity();
  renderPersonaSheet();
  closeSheets();
  say('hello');
}
function personaCard(p, id) {
  const on = S().persona === id;
  const card = document.createElement('div'); card.className = 'pcard' + (on ? ' on' : '');
  const n = document.createElement('div'); n.className = 'pn'; n.textContent = nameOf(p);
  const t = document.createElement('div'); t.className = 'pt'; t.textContent = taglineOf(p);
  let actionEl;
  if (on) { actionEl = document.createElement('span'); actionEl.className = 'badge pb'; actionEl.textContent = T('inUse'); }
  else { actionEl = document.createElement('button'); actionEl.className = 'btn small pb'; actionEl.textContent = T('use'); actionEl.addEventListener('click', () => setPersona(id)); }
  const sample = document.createElement('p'); sample.className = 'ps';
  const lines = linesOf(p);
  sample.textContent = '「' + String(lines.hello || '').replace(/\{name\}/g, (S().callName || '').trim() || defaultCall(p)) + '」';
  card.append(n, actionEl, t, sample);
  if (isCustom(p) && p.lang !== lang()) {
    const warn = document.createElement('p'); warn.className = 'note'; warn.style.gridColumn = '1 / -1';
    warn.textContent = T('genNeedLang', { lang: I18N[p.lang]?.langName || p.lang });
    card.append(warn);
  }
  return card;
}
function fillSelect(sel, keys, labels, value) {
  sel.textContent = '';
  for (const k of keys) { const o = document.createElement('option'); o.value = k; o.textContent = labels[k]; sel.append(o); }
  if (value) sel.value = value;
}
function renderPersonaSheet() {
  const box = $('#persona-cards'); box.textContent = '';
  for (const id of PRESET_ORDER) box.append(personaCard(PRESETS[id], id));
  if (Store.state.custom) box.append(personaCard(Store.state.custom, 'custom'));
  const c = Store.state.custom && Store.state.custom.traits;
  fillSelect($('#tr-rel'), TRAITS.rel, T('rels'), $('#tr-rel').value || c?.rel || 'onee');
  fillSelect($('#tr-temp'), TRAITS.temp, T('temps'), $('#tr-temp').value || c?.temp || 'cool');
  fillSelect($('#tr-quirk'), TRAITS.quirk, T('quirks'), $('#tr-quirk').value || c?.quirk || 'monoshiri');
  $('#tr-generate').textContent = Store.state.custom && Store.state.custom.lang !== lang() && sameTraits() ? T('regenerate') : T('generate');
}
function sameTraits() {
  const c = Store.state.custom && Store.state.custom.traits; if (!c) return false;
  return c.rel === $('#tr-rel').value && c.temp === $('#tr-temp').value && c.quirk === $('#tr-quirk').value;
}
const rnd = (arr) => arr[(Math.random() * arr.length) | 0];
$('#tr-random').addEventListener('click', () => {
  $('#tr-rel').value = rnd(TRAITS.rel); $('#tr-temp').value = rnd(TRAITS.temp); $('#tr-quirk').value = rnd(TRAITS.quirk);
  renderPersonaSheet();
});
['#tr-rel', '#tr-temp', '#tr-quirk'].forEach((s) => $(s).addEventListener('change', renderPersonaSheet));

let genCtl = null;
function buildPrompt(traits, L, base) {
  const ja = I18N.ja, cur = I18N[L];
  const ref = JSON.stringify(base.lines[L], null, 1);
  return [
    'You are writing voice lines for a character in a smartphone "drive buddy" app. The character appears on screen and talks to the driver before, during and after a drive. Every line is read aloud by text-to-speech, so keep each line short (one or two sentences), natural to say out loud, and easy to follow without looking at the screen.',
    '',
    'Combine all three traits into one consistent character:',
    `- Relationship / speech register: ${ja.rels[traits.rel]} (${I18N.en.rels[traits.rel]})`,
    `- Temperament: ${ja.temps[traits.temp]} (${I18N.en.temps[traits.temp]})`,
    `- Quirk: ${ja.quirks[traits.quirk]} (${I18N.en.quirks[traits.quirk]})`,
    '',
    `Write everything in ${cur.langName} (${L}).`,
    '',
    'Rules:',
    '- Driving safety comes first. Never encourage speeding, using the phone while driving, or driving while sleepy. Advice about breaks and sleep stays sincere even when the character teases.',
    '- Friendly only: no romantic or sexual content.',
    '- Keep each {placeholder} wherever the reference line for the same key uses it, spelled exactly the same. {name} = how the character addresses the driver, {h} = a number of hours, {t} = an elapsed-time phrase, {n} = a count, {lv} = a bond level name, {dist} = a distance phrase, {stop} = a rest-stop name, {info} = a short sentence about opening hours and crowding (it may be empty, so the line must still read well without it).',
    '- When the reference value for a key is a list, return a list with the same number of items.',
    '- arriveGoodBreak, arriveNoBreak and arriveLate are short add-on sentences appended right after an arrival line.',
    '',
    'Reply with only one JSON object of this shape:',
    '{"name": "<short character name, at most 8 characters>", "tagline": "<one-line description, at most 30 characters>", "call": "<default way the character addresses the driver, at most 8 characters>", "lines": {<the same keys as the reference>}}',
    '',
    'Reference lines from a different character (match the keys, placeholders and length, not the personality):',
    ref,
  ].join('\n');
}
function validateCustom(raw, base, L) {
  if (!raw || typeof raw !== 'object' || !raw.lines || typeof raw.lines !== 'object') throw new Error('shape');
  const refLines = base.lines[L];
  const out = {};
  let used = 0;
  for (const k of LINE_KEYS) {
    const ref = refLines[k], got = raw.lines[k];
    const need = new Set((JSON.stringify(ref).match(/\{(h|t|n|lv|dist|stop|info)\}/g) || []));
    const okStr = (s) => typeof s === 'string' && s.trim() && s.length <= 220 && [...need].every((ph) => s.includes(ph) || (Array.isArray(ref)));
    if (Array.isArray(ref)) {
      const arr = Array.isArray(got) ? got.filter((s) => typeof s === 'string' && s.trim() && s.length <= 220) : [];
      const fine = arr.filter((s) => [...need].every((ph) => s.includes(ph)));
      out[k] = fine.length ? fine.slice(0, ref.length) : ref; if (fine.length) used++;
    } else {
      out[k] = okStr(got) ? got.trim() : ref; if (okStr(got)) used++;
    }
  }
  if (used < LINE_KEYS.length * 0.6) throw new Error('too few usable lines');
  const clip = (s, n, fb) => (typeof s === 'string' && s.trim() ? [...s.trim()].slice(0, n).join('') : fb);
  return {
    name: clip(raw.name, 12, base.name[L]),
    tagline: clip(raw.tagline, 40, ''),
    call: clip(raw.call, 12, base.call[L]),
    lines: out,
  };
}
$('#tr-generate').addEventListener('click', async () => {
  const status = $('#gen-status'), btn = $('#tr-generate'), cancel = $('#gen-cancel');
  const traits = { rel: $('#tr-rel').value, temp: $('#tr-temp').value, quirk: $('#tr-quirk').value };
  const L = lang(), baseId = TEMP_BASE[traits.temp] || 'kohai', base = PRESETS[baseId];
  let sample = null;
  try { sample = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('sample') : null; } catch {}
  if (!sample) { status.textContent = T('genNoSample'); return; }
  genCtl = new AbortController();
  btn.disabled = true; cancel.hidden = false;
  status.textContent = T('generating');
  try {
    const raw = await sample.json(buildPrompt(traits, L, base), {
      signal: genCtl.signal, cache: false,
      onText: ({ text }) => { status.textContent = `${T('generating')} ${[...text].length}`; },
    });
    const v = validateCustom(raw, base, L);
    Store.state.custom = {
      id: 'custom', base: baseId, lang: L, traits, ...v,
      voice: TEMP_VOICE[traits.temp] || base.voice, expr: base.expr, emoMap: base.emoMap, gestMap: base.gestMap,
    };
    Store.save();
    status.textContent = T('genDone');
    setPersona('custom');
  } catch (e) {
    status.textContent = e && e.code === 'cancelled' ? '' : (e && (e.code === 'not_granted' || e.code === 'sampling_disabled') ? T('genNoSample') : T('genFail'));
  } finally {
    btn.disabled = false; cancel.hidden = true; genCtl = null;
  }
});
$('#gen-cancel').addEventListener('click', () => { if (genCtl) genCtl.abort(); });
